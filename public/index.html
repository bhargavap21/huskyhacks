<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Look Demo</title>
<meta name="description" content="Concept demo: Second Look inside a simulated Sound app, with an employee console. Synthetic kit data only.">
<script>try{var t=localStorage.getItem("sl-theme");if(t==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <button id="side-toggle" class="icon-btn" aria-controls="side" aria-expanded="true" aria-label="Collapse page list">☰</button>
  <span class="topbar-title">Second Look</span>
  <span class="topbar-meta">Concept for HuskyHack 2026 · synthetic data</span>
  <span class="topbar-spacer"></span>
  <button id="invite" class="quiet">Invite a phone</button>
  <button id="copilot-toggle" class="primary" aria-controls="copilot" aria-expanded="true">Ask Second Look</button>
</header>
<div class="demo-bar" role="toolbar" aria-label="Demo controls">
  <span class="tag">Demo</span>
  <label class="sr" for="scene">Scene</label>
  <select id="scene"></select>
  <button id="play" class="primary">Play</button>
  <button id="next">Next event</button>
  <button id="faster" title="Speed up the replay clock">Faster</button>
  <button id="reset">Restart</button>
  <span class="clock" aria-live="off">Kit time <span id="clock">–</span> <span id="speed" class="muted small"></span></span>
</div>
<div class="shell" id="shell">
  <nav class="side" id="side" aria-label="Pages">
    <div class="side-label">Member app</div>
    <button data-page="home"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span><span class="lbl">Home</span></button>
    <button data-page="inbox"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16V11a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10 21h4"/></svg></span><span class="lbl">Alerts</span><span class="side-count" id="count-inbox"></span></button>
    <button data-page="guardian"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span><span class="lbl">Call guardian</span></button>
    <div class="side-label">Sound employee</div>
    <button data-page="console"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M3 14h18"/></svg></span><span class="lbl">Console</span><span class="side-count" id="count-console"></span></button>
    <div class="side-label">Demo</div>
    <button data-page="split"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><path d="M12 4v16"/></svg></span><span class="lbl">Side by side</span></button>
    <button data-page="onboarding"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></span><span class="lbl">App setup</span></button>
    <button data-page="timeline"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg></span><span class="lbl">Kit timeline</span></button>
    <a class="side-link" href="/about"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span><span class="lbl">About this concept</span></a>
    <div class="side-foot">
      <button class="acct-btn" id="acct-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu"><span class="avatar-sm" id="acct-initial" aria-hidden="true">L</span><span class="lbl" id="acct-label">Linda</span><span class="lbl acct-chev" aria-hidden="true">⌃</span></button>
    </div>
  </nav>
  <div class="acct-menu" id="acct-menu" role="menu" aria-label="Account" hidden>
    <div class="acct-head"><span class="acct-kicker">Account</span><span id="acct-name">Linda · M1001</span></div>
    <button role="menuitem" data-page="profile"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Profile</button>
    <button role="menuitem" data-page="settings"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>Settings</button>
    <button role="menuitem" id="theme" aria-pressed="false"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></span>Appearance<span class="acct-pill" id="theme-state">Light</span></button>
    <div class="acct-sep"></div>
    <button role="menuitem" id="acct-sign" data-act="sign_out"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3M11 8l4 4-4 4M21 4v16"/></svg></span><span id="acct-sign-lbl">Sign out</span></button>
  </div>
  <main class="main" id="main">
    <div class="blurb" id="blurb"></div>
    <div id="page"></div>
  </main>
  <aside class="copilot" id="copilot" aria-label="Second Look chat"><div id="copilot-body" class="copilot-body"></div></aside>
</div>
<dialog class="invite-dlg" id="invite-dlg" aria-labelledby="invite-title">
  <h2 id="invite-title">Join on your phone</h2>
  <p class="small">Scan to open Linda’s member app on your phone, linked to this demo. Everything stays synthetic: no real money, no sign-in.</p>
  <div class="invite-qr" id="invite-qr" aria-hidden="true"></div>
  <p class="invite-url" id="invite-url"></p>
  <button class="primary" id="invite-close">Done</button>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
