  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    postToHost(&quot;height&quot;, {

          document.body.getBoundingClientRect().height,
        ),

  };

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

      }

              typeof data === &quot;object&quot; &amp;&amp;

#sound-concept .s-casehead { display:flex; justify-content:space-between; gap:14px; align-items:start; flex-wrap:wrap; margin-bottom:22px; }

#sound-concept .s-facts dt { font-size:13px; color:var(--s-muted); }
#sound-concept .s-facts dd { margin:3px 0 0; font-weight:500; }
#sound-concept .s-reasons { padding:0; margin:12px 0 0; list-style:none; display:grid; gap:10px; }
#sound-concept .s-reasons li { display:flex; align-items:flex-start; gap:10px; }
#sound-concept .s-reasons i { margin-top:4px; flex-shrink:0; color:var(--s-brand); }
#sound-concept .s-history { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:12px; font-size:14px; }
#sound-concept .s-history li { display:grid; grid-template-columns:76px 1fr; gap:12px; }

#sound-concept .s-announcement { margin-top:14px; color:var(--s-brand); }
@media(max-width:760px) { #sound-concept .s-workspace { grid-template-columns:1fr; } #sound-concept .s-queue { grid-template-columns:1fr 1fr; } #sound-concept .s-queue h3 { grid-column:1/-1; } #sound-concept .s-top { gap:12px; padding:16px 22px; } #sound-concept .s-context { order:2; } #sound-concept .s-nav { order:3; width:100%; } #sound-concept .s-main { padding:24px 20px; } }
@media(max-width:440px) { #sound-concept h1 { font-size:26px; } #sound-concept h2 { font-size:21px; } #sound-concept .s-money { font-size:32px; } #sound-concept .s-main { padding:22px 14px; } #sound-concept .s-box { padding:20px; } #sound-concept .s-nav { gap:0; justify-content:space-between; } #sound-concept .s-nav button { padding:10px; } #sound-concept .s-actions { align-items:stretch; flex-direction:column; } #sound-concept .s-queue { grid-template-columns:1fr; } #sound-concept .s-facts { grid-template-columns:1fr; gap:12px; } }

&lt;div id=&quot;sound-concept&quot; aria-label=&quot;Sound interface concept&quot;&gt;
  &lt;div class=&quot;s-demo&quot;&gt;

      &lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-role=&quot;employee&quot; aria-pressed=&quot;false&quot;&gt;Employee view&lt;/button&gt;

  &lt;div class=&quot;s-app&quot;&gt;

      &lt;div class=&quot;s-logo&quot;&gt;&lt;i data-lucide=&quot;audio-lines&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; sound&lt;/div&gt;
      &lt;nav class=&quot;s-nav&quot; id=&quot;sound-nav&quot; aria-label=&quot;Main navigation&quot;&gt;&lt;/nav&gt;
      &lt;span class=&quot;s-context&quot; id=&quot;sound-context&quot;&gt;Member banking&lt;/span&gt;
    &lt;/header&gt;
    &lt;main class=&quot;s-main&quot; id=&quot;sound-content&quot;&gt;&lt;/main&gt;
  &lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
 const root = document.getElementById(&#x27;sound-concept&#x27;);
 const content = root.querySelector(&#x27;#sound-content&#x27;);
 const nav = root.querySelector(&#x27;#sound-nav&#x27;);
 const announcement = root.querySelector(&#x27;#sound-announcement&#x27;);
 const defaults = { role:&#x27;client&#x27;, page:&#x27;home&#x27;, step:&#x27;home&#x27;, selected:&#x27;linda&#x27;, employeeStep:&#x27;details&#x27;, lindaStatus:&#x27;paused&#x27;, homeStatus:&#x27;paused&#x27;, trusted:false, verified:false, intent:&#x27;&#x27;, checked:false, employeeNote:&#x27;&#x27;, helpTopic:&#x27;&#x27;, reportSent:false };
 let state = {...defaults};
 const saved = window.openai?.widgetState?.privateContent;
 if (saved &amp;&amp; saved.version === 1 &amp;&amp; saved.state) state = {...defaults,...saved.state};
 const design = { textSize:&#x27;Standard&#x27;, spacing:&#x27;Comfortable&#x27; };
 const cases = {
   linda:{name:&#x27;Linda&#x27;,id:&#x27;M1001&#x27;,amount:&#x27;$8,500.00&#x27;,recipient:&#x27;New recipient&#x27;,recipientId:&#x27;R1001-11&#x27;,date:&#x27;Oct 20&#x27;,time:&#x27;6:21 PM&#x27;,channel:&#x27;Branch&#x27;,reasons:[&#x27;First wire in over 6 years&#x27;,&#x27;Recipient added today&#x27;,&#x27;Amount is 4.77× the usual payment amount&#x27;],events:[[&#x27;2:04 PM&#x27;,&#x27;New wire recipient added&#x27;],[&#x27;2:11 PM&#x27;,&#x27;$8,500 wire requested&#x27;],[&#x27;2:14 PM&#x27;,&#x27;Member confirmed the payment was intended&#x27;],[&#x27;2:21 PM&#x27;,&#x27;Payment paused for review&#x27;]]},
   home:{name:&#x27;Member 1057&#x27;,id:&#x27;M1057&#x27;,amount:&#x27;$51,586.52&#x27;,recipient:&#x27;New recipient&#x27;,recipientId:&#x27;R1057-10&#x27;,date:&#x27;Oct 19&#x27;,time:&#x27;1:45 PM&#x27;,channel:&#x27;Branch&#x27;,reasons:[&#x27;Amount is 42.63× the usual payment amount&#x27;,&#x27;Recipient added 2 days earlier&#x27;],events:[[&#x27;Oct 17&#x27;,&#x27;New wire recipient added&#x27;],[&#x27;9:41 AM&#x27;,&#x27;$51,586.52 wire requested&#x27;],[&#x27;9:45 AM&#x27;,&#x27;Payment paused for review&#x27;]]}
 };
 const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
 const button = (label,action,primary=false,extra=&#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; class=&quot;s-button cursor-interaction ${primary?&#x27;s-primary&#x27;:&#x27;&#x27;}&quot; data-action=&quot;${action}&quot; ${extra}&gt;${label}&lt;/button&gt;`;
 const textButton = (label,action) =&gt; `&lt;button type=&quot;button&quot; class=&quot;s-text cursor-interaction&quot; data-action=&quot;${action}&quot;&gt;${label}&lt;/button&gt;`;
 const choice = (label,action) =&gt; `&lt;button type=&quot;button&quot; class=&quot;s-button s-choice cursor-interaction&quot; data-action=&quot;${action}&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;`;
 const tag = status =&gt; `&lt;span class=&quot;s-status ${status!==&#x27;paused&#x27;?&#x27;s-good&#x27;:&#x27;&#x27;}&quot;&gt;${icon(status===&#x27;paused&#x27;?&#x27;clock-3&#x27;:&#x27;check&#x27;)}${({paused:&#x27;Payment paused&#x27;,sent:&#x27;Payment sent&#x27;,cancelled:&#x27;Payment cancelled&#x27;,stopped:&#x27;Payment stopped&#x27;,specialist:&#x27;Specialist requested&#x27;})[status]||status}&lt;/span&gt;`;
 const heading = (title,sub=&#x27;&#x27;) =&gt; `&lt;div class=&quot;s-heading&quot;&gt;&lt;h1&gt;${title}&lt;/h1&gt;${sub?`&lt;p&gt;${sub}&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;`;
 const footer = () =&gt; `&lt;div class=&quot;s-footer&quot;&gt;${textButton(&#x27;Get help with a scam&#x27;,&#x27;help&#x27;)}${textButton(&#x27;Someone you trust&#x27;,&#x27;trusted&#x27;)}&lt;/div&gt;`;
 const clientShell = inner =&gt; `&lt;div class=&quot;s-client&quot;&gt;${inner}${footer()}&lt;/div&gt;`;
 function remember(){
   if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{view:state.role,clientScreen:state.step,selectedEmployeeCase:state.selected,paymentStatus:state.lindaStatus},privateContent:{version:1,state}}).catch(()=&gt;{});
 }
 function announce(message){announcement.textContent=message;}
 function paymentSummary(){return `&lt;div class=&quot;s-money&quot;&gt;$8,500.00&lt;/div&gt;&lt;p&gt;Wire transfer · New recipient&lt;/p&gt;`;}
 function home(){
   const pending=state.lindaStatus===&#x27;paused&#x27;||state.lindaStatus===&#x27;specialist&#x27;;
   return clientShell(`${heading(&#x27;Hi, Linda.&#x27;,pending?&#x27;Let’s check one payment together.&#x27;:&#x27;You’re up to date.&#x27;)}&lt;section class=&quot;s-box&quot; aria-label=&quot;Payment needing attention&quot;&gt;${tag(state.lindaStatus)}${paymentSummary()}&lt;hr class=&quot;s-rule&quot;&gt;${pending?`&lt;div class=&quot;s-stack&quot;&gt;&lt;h3&gt;The money has not been sent.&lt;/h3&gt;&lt;p&gt;This is your first wire in over 6 years, and it’s going to someone new.&lt;/p&gt;&lt;p class=&quot;s-muted s-small&quot;&gt;Paused until Oct 20 at 6:21 PM. You can review it now.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Review payment&#x27;,&#x27;review&#x27;,true)}${button(&#x27;Talk to someone&#x27;,&#x27;talk&#x27;)}&lt;/div&gt;`:`&lt;p&gt;${state.lindaStatus===&#x27;sent&#x27;?&#x27;Your payment has been sent. You can still report a concern and ask for recovery help.&#x27;:state.lindaStatus===&#x27;stopped&#x27;?&#x27;This payment was reported as not yours. Account support is the next step.&#x27;:&#x27;The money was not sent. We’re here if you need help.&#x27;}&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;View payment&#x27;,&#x27;payments&#x27;,true)}&lt;/div&gt;`}&lt;/section&gt;`);
 }
 function clientReview(){
   const back = textButton(`${icon(&#x27;arrow-left&#x27;)} Back`, &#x27;back&#x27;);
   if(state.step===&#x27;recognize&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;div class=&quot;s-eyebrow&quot;&gt;Payment check · 1 of 2&lt;/div&gt;&lt;h2&gt;Did you choose to send this money?&lt;/h2&gt;${paymentSummary()}&lt;p class=&quot;s-muted&quot; style=&quot;margin:14px 0 22px&quot;&gt;A wire is a bank transfer. Please check the amount before continuing.&lt;/p&gt;&lt;div class=&quot;s-stack&quot;&gt;${choice(&#x27;Yes, I did&#x27;,&#x27;recognized&#x27;)}${choice(&#x27;No, I didn’t&#x27;,&#x27;not-mine&#x27;)}${choice(&#x27;I’m not sure&#x27;,&#x27;unsure&#x27;)}&lt;/div&gt;&lt;/section&gt;`);
   if(state.step===&#x27;pressure&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;div class=&quot;s-eyebrow&quot;&gt;Payment check · 2 of 2&lt;/div&gt;&lt;h2&gt;Has anyone asked you to rush or keep this payment secret?&lt;/h2&gt;&lt;p class=&quot;s-muted&quot; style=&quot;margin:14px 0 22px&quot;&gt;You can tell us. We’re here to help.&lt;/p&gt;&lt;div class=&quot;s-stack&quot;&gt;${choice(&#x27;Yes, or I’m not sure&#x27;,&#x27;concern&#x27;)}${choice(&#x27;No&#x27;,&#x27;confirm&#x27;)}&lt;/div&gt;&lt;/section&gt;`);
   if(state.step===&#x27;concern&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;span class=&quot;s-status&quot;&gt;Payment still paused&lt;/span&gt;&lt;h2 style=&quot;margin:20px 0 12px&quot;&gt;Let’s check together.&lt;/h2&gt;&lt;p&gt;Before sending money, try reaching the person using a phone number you already know.&lt;/p&gt;&lt;div class=&quot;s-note&quot; style=&quot;margin-top:20px&quot;&gt;&lt;p&gt;You can speak privately with a Sound employee. You choose whether to involve anyone else.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Talk to someone&#x27;,&#x27;talk&#x27;,true)}${button(&#x27;Cancel this payment&#x27;,&#x27;cancel-review&#x27;)}&lt;/div&gt;${textButton(&#x27;I still want to send this payment&#x27;,&#x27;confirm&#x27;)}&lt;/section&gt;`);
   if(state.step===&#x27;confirm&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;div class=&quot;s-eyebrow&quot;&gt;Final review&lt;/div&gt;&lt;h2&gt;Ready to send this payment?&lt;/h2&gt;${paymentSummary()}&lt;hr class=&quot;s-rule&quot;&gt;&lt;p&gt;Once a wire is sent, getting the money back is not guaranteed.&lt;/p&gt;&lt;label class=&quot;s-check&quot; style=&quot;margin-top:14px&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;sound-send-check&quot; ${state.checked?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;I checked the payment details and want to send this money.&lt;/span&gt;&lt;/label&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Send $8,500.00&#x27;,&#x27;send&#x27;,true,state.checked?&#x27;&#x27;:&#x27;disabled&#x27;)}${button(&#x27;Keep it paused&#x27;,&#x27;home&#x27;)}&lt;/div&gt;&lt;/section&gt;`);
   if(state.step===&#x27;not-mine&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;h2&gt;We’ll help secure your account.&lt;/h2&gt;&lt;p style=&quot;margin-top:14px&quot;&gt;Report this payment so our team can stop it and check your account access.&lt;/p&gt;${paymentSummary()}&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Report this payment&#x27;,&#x27;stop&#x27;,true)}${button(&#x27;Go back&#x27;,&#x27;review&#x27;)}&lt;/div&gt;&lt;p class=&quot;s-muted s-small&quot; style=&quot;margin-top:18px&quot;&gt;If your contact details changed unexpectedly, use the number on your card or visit a branch.&lt;/p&gt;&lt;/section&gt;`);
   if(state.step===&#x27;cancel&#x27;) return clientShell(`${back}&lt;section class=&quot;s-box&quot;&gt;&lt;h2&gt;Cancel this payment?&lt;/h2&gt;${paymentSummary()}&lt;p style=&quot;margin-top:16px&quot;&gt;The money will not be sent. You can make a new payment later.&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Cancel payment&#x27;,&#x27;cancel&#x27;,true)}${button(&#x27;Keep reviewing&#x27;,&#x27;review&#x27;)}&lt;/div&gt;&lt;/section&gt;`);
   return home();
 }
 function help(){
   if(state.helpTopic===&#x27;talk&#x27;) return clientShell(`${heading(&#x27;Talk to someone.&#x27;,&#x27;You don’t have to figure this out alone.&#x27;)}&lt;section class=&quot;s-box&quot;&gt;&lt;h3&gt;Speak with Sound&lt;/h3&gt;&lt;p style=&quot;margin-top:12px&quot;&gt;Call the number on the back of your card, or speak with an employee at a branch.&lt;/p&gt;&lt;p class=&quot;s-muted&quot; style=&quot;margin-top:12px&quot;&gt;If someone told you to make this payment, you can ask to speak privately.&lt;/p&gt;${state.lindaStatus===&#x27;paused&#x27;?`&lt;div class=&quot;s-note&quot; style=&quot;margin-top:20px&quot;&gt;Your wire is paused until Oct 20 at 6:21 PM.&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Back to home&#x27;,&#x27;home&#x27;,true)}&lt;/div&gt;&lt;/section&gt;`);
   if(state.helpTopic===&#x27;report&#x27;) return clientShell(`${heading(&#x27;Report money already sent.&#x27;,&#x27;Tell us what happened. We’ll help with the next step.&#x27;)}&lt;form class=&quot;s-box&quot; id=&quot;sound-report-form&quot;&gt;&lt;label class=&quot;s-label&quot;&gt;Payment type&lt;select class=&quot;s-input&quot; name=&quot;rail&quot;&gt;&lt;option&gt;Wire transfer&lt;/option&gt;&lt;option&gt;Bank transfer (ACH)&lt;/option&gt;&lt;option&gt;Person-to-person payment (P2P)&lt;/option&gt;&lt;option&gt;Cash withdrawal&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label class=&quot;s-label&quot;&gt;Amount sent ($)&lt;input class=&quot;s-input&quot; name=&quot;amount&quot; type=&quot;number&quot; min=&quot;0.01&quot; step=&quot;0.01&quot; inputmode=&quot;decimal&quot; required value=&quot;${state.lindaStatus===&#x27;sent&#x27;?&#x27;8500&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/label&gt;&lt;label class=&quot;s-label&quot;&gt;What happened? &lt;span class=&quot;s-muted s-small&quot;&gt;Optional. Don’t include passwords or security codes.&lt;/span&gt;&lt;textarea class=&quot;s-input&quot; rows=&quot;3&quot; name=&quot;story&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;p class=&quot;s-muted s-small&quot;&gt;Recovery is not guaranteed. Person-to-person payments cannot be recalled once sent.&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;&lt;button class=&quot;s-button s-primary cursor-interaction&quot; type=&quot;submit&quot;&gt;Report payment&lt;/button&gt;${button(&#x27;Go back&#x27;,&#x27;help&#x27;)}&lt;/div&gt;&lt;/form&gt;`);
   if(state.helpTopic===&#x27;reported&#x27;) return clientShell(`${heading(&#x27;Your report is recorded.&#x27;,&#x27;A Sound employee will review the next steps.&#x27;)}&lt;section class=&quot;s-box&quot;&gt;&lt;span class=&quot;s-status s-good&quot;&gt;Report received&lt;/span&gt;&lt;h3 style=&quot;margin-top:20px&quot;&gt;Recovery review is next&lt;/h3&gt;&lt;p style=&quot;margin-top:12px&quot;&gt;For urgent support, call the number on your card or visit a branch. We can explore recovery options, but we can’t promise the money will be returned.&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Back to home&#x27;,&#x27;home&#x27;,true)}&lt;/div&gt;&lt;/section&gt;`);
   return clientShell(`${heading(&#x27;How can we help?&#x27;,&#x27;Choose what you need help with.&#x27;)}&lt;div class=&quot;s-helpgrid&quot;&gt;${choice(&#x27;&lt;strong&gt;Talk to someone&lt;/strong&gt;&lt;small&gt;Speak privately with a Sound employee.&lt;/small&gt;&#x27;,&#x27;talk&#x27;)}${choice(&#x27;&lt;strong&gt;Report money already sent&lt;/strong&gt;&lt;small&gt;Start getting help with a payment.&lt;/small&gt;&#x27;,&#x27;report&#x27;)}${choice(&#x27;&lt;strong&gt;I don’t recognize a payment&lt;/strong&gt;&lt;small&gt;Get help with access to your account.&lt;/small&gt;&#x27;,&#x27;not-mine&#x27;)}&lt;/div&gt;`);
 }
 function trusted(){return clientShell(`${heading(&#x27;Someone you trust.&#x27;,&#x27;It’s always your choice to involve another person.&#x27;)}&lt;section class=&quot;s-box&quot;&gt;&lt;h3&gt;Ask for support, on your terms&lt;/h3&gt;&lt;p style=&quot;margin:12px 0 18px&quot;&gt;A support person can be informed about a concern. They cannot access your account or decide whether your payment goes ahead.&lt;/p&gt;&lt;label class=&quot;s-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;sound-trusted&quot; ${state.trusted?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;span&gt;I’d like an employee to discuss this option with me.&lt;/span&gt;&lt;/label&gt;&lt;p class=&quot;s-muted s-small&quot; style=&quot;margin-top:10px&quot;&gt;You can change your mind. We won’t contact anyone unless you choose them and agree.&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;Back to home&#x27;,&#x27;home&#x27;,true)}&lt;/div&gt;&lt;/section&gt;`);}
