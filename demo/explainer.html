<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vantis explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Pixelify+Sans:wght@400;500&display=swap">
<style>
/* Pixel-art explainer. Self-contained: canvas art, browser text-to-speech voices, no build step. */
:root {
  --ink: #141518; --paper: #f3f4f1; --paper-2: #e4e5e1; --muted: #6e7079;
  --accent: #2f7fc1; --accent-soft: #cfe3f3;
  --hud: #141518; --hud-text: #f0f0ec;
  --px: "Silkscreen", "Courier New", monospace;
  --body: "Pixelify Sans", "Courier New", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #2a2c31; overflow: hidden; color: var(--ink); font-family: var(--body); }
#stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; background: #2a2c31; overflow: hidden; }
.land #stage { width: 1280px; height: 720px; }
.port #stage { width: 720px; height: 1280px; }

/* The scene: a 240x135 canvas drawn pixel by pixel, scaled up crisp */
#scene { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
.land #scene { width: 1280px; height: 720px; }
.port #scene { width: 720px; height: 405px; }
#ov { position: absolute; left: 0; top: 0; width: 240px; height: 135px; transform-origin: 0 0; pointer-events: none; }
.land #ov { transform: scale(5.3333); } .port #ov { transform: scale(3); }
.mon { position: absolute; text-align: center; font-family: var(--px); color: var(--ink); line-height: 1; }
.mon .nm { font-size: 5px; letter-spacing: .2px; }
.mon .st { display: inline-block; margin-top: 2px; font-size: 3.6px; padding: 1px 2px; background: var(--accent); color: #fff; }

/* HUD box, like a game status panel */
.hud { position: absolute; background: var(--hud); color: var(--hud-text); border: 4px solid #e9e9e6; outline: 4px solid var(--hud); font-family: var(--px); display: none; }
.hud.on { display: block; }
.land .hud { left: 40px; top: 36px; padding: 14px 22px; font-size: 22px; line-height: 34px; }
.port .hud { left: 18px; top: 16px; padding: 8px 12px; font-size: 15px; line-height: 23px; border-width: 3px; outline-width: 3px; }
.hud .r { display: flex; gap: 22px; }
.hud .k { color: #a9abb2; min-width: 7.5em; }
.hud .v { color: #fff; }
.hud .v.ok::before { content: "✓ "; color: #7fc4f5; }


/* Side panel: the phone or Vantis's card */
.panel { position: absolute; background: var(--paper); border: 6px solid var(--ink); box-shadow: 8px 8px 0 rgba(20,21,24,.25); display: none; }
.panel.on { display: block; animation: popin .35s steps(4) both; }
@keyframes popin { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.land .panel { right: 40px; top: 96px; width: 430px; }
.port .panel { left: 40px; right: 40px; top: 432px; }
.ph { background: var(--ink); color: var(--hud-text); font-family: var(--px); font-size: 18px; padding: 10px 16px; display: flex; justify-content: space-between; }
.ph span { color: #a9abb2; }
.pb { padding: 16px 18px 18px; font-size: 22px; line-height: 30px; }
.port .ph { font-size: 22px; padding: 12px 18px; } .port .pb { font-size: 28px; line-height: 38px; padding: 20px 22px 24px; }
.bub { background: var(--paper-2); border: 3px solid var(--ink); padding: 8px 12px; margin-bottom: 10px; max-width: 92%; }
.f { border-bottom: 3px solid var(--paper-2); padding: 4px 0; font-size: .82em; }
.f b { font-weight: 500; color: var(--muted); }
.q { border-left: 5px solid var(--muted); padding-left: 10px; margin-top: 10px; font-size: .9em; }
.btn { display: inline-block; font-family: var(--px); font-size: .72em; padding: 6px 14px; border: 3px solid var(--ink); background: var(--paper); margin-top: 12px; box-shadow: 3px 3px 0 var(--ink); }
.btn.pri { background: var(--accent); color: #fff; }
.btn.press { transform: translate(3px, 3px); box-shadow: none; }
.hl { padding: 0 2px; margin: 0 -2px; transition: background .2s steps(2); }
.hl.on { background: var(--accent-soft); box-shadow: inset 0 -4px 0 var(--accent); }
.chips { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 14px; }
.chip { font-family: var(--px); font-size: .62em; line-height: 1.4; padding: 4px 10px; border: 3px solid var(--ink); background: var(--paper); display: none; }
.chip.on { display: inline-block; animation: popin .3s steps(3) both; }
.chip::before { content: "■ "; color: var(--accent); }
.small { font-size: .78em; color: var(--muted); margin-top: 8px; }
.next { background: var(--accent-soft); border: 3px solid var(--accent); padding: 8px 12px; margin: 8px 0; }
.next i { display: block; font-style: normal; font-family: var(--px); font-size: .6em; color: var(--accent); }
.badge { display: inline-block; font-family: var(--px); font-size: .6em; padding: 3px 8px; background: var(--ink); color: #fff; margin-bottom: 8px; }
.badge.ok { background: var(--accent); }
.big { font-size: 1.5em; line-height: 1.2; margin: 4px 0 8px; }

/* Dialogue box */
.dlg { position: absolute; background: var(--hud); color: #fff; border: 5px solid #e9e9e6; outline: 5px solid var(--hud); }
.land .dlg { left: 46px; right: 46px; bottom: 34px; min-height: 132px; padding: 16px 26px 18px; }
.port .dlg { left: 24px; right: 24px; top: 896px; min-height: 230px; padding: 22px 26px; }
.dlg.hide { visibility: hidden; }
.who { font-family: var(--px); font-size: 20px; color: #7fc4f5; margin-bottom: 6px; }
.say { font-size: 34px; line-height: 44px; min-height: 44px; }
.fine { font-size: 18px; color: #a9abb2; margin-top: 6px; }
.port .who { font-size: 24px; } .port .say { font-size: 40px; line-height: 52px; } .port .fine { font-size: 22px; }


.start button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
/* Start and end screens */
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; }
.start { position: absolute; top: 28px; right: 28px; z-index: 50; }
.port .start { top: 18px; right: 18px; }
.end { background: var(--hud); display: none; z-index: 20; padding: 0 40px; }
.end.on { display: flex; }
.end h1 { font-family: var(--px); font-weight: 400; font-size: 64px; line-height: 1.1; letter-spacing: 2px; }
.end p { font-size: 28px; line-height: 38px; margin-top: 14px; max-width: 900px; }
.start button { font-family: var(--px); font-size: 22px; padding: 12px 22px; background: var(--accent); color: #fff; border: 4px solid #fff; cursor: pointer; box-shadow: 5px 5px 0 #000; }
.end small { display: block; margin-top: 26px; font-size: 18px; color: #a9abb2; }
.end .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 26px; }
.end .chip { display: inline-block; background: transparent; color: #fff; border-color: #fff; font-size: 16px; }
.port .end h1 { font-size: 52px; } .port .end p { font-size: 30px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" width="240" height="135" aria-hidden="true"></canvas>


  <div class="hud" id="hud" aria-hidden="true"></div>
  <div class="panel" id="panel" aria-hidden="true"></div>

  <div class="dlg hide" id="dlg" aria-live="polite"><div class="who" id="who"></div><div class="say" id="say"></div><div class="fine" id="fine"></div></div>

  <div class="end" id="end">
    <h1>VANTIS</h1>
    <p>Forward a text that feels off. Let Vantis answer the calls you don’t pick up. Check first, then decide.</p>
    <div class="row"><span class="chip">Checks texts</span><span class="chip">Screens calls</span><span class="chip">Never moves money</span></div>
    <small>Simulated demo. Linda and the caller are made-up characters.</small>
  </div>

  <div class="start" id="start"><button id="go" aria-label="Play the Vantis explainer">▶ PLAY</button></div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('scene'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------------- Layout ----------------
function fit() {
  const port = innerHeight / innerWidth > 1.1;
  document.body.className = port ? 'port' : 'land';
  const W = port ? 720 : 1280, H = port ? 1280 : 720;
  stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)}) translate(-50%, -50%)`;
}
addEventListener('resize', fit); fit();

// ---------------- Pixel drawing ----------------
const C = {
  wall: '#d6d6d3', wall2: '#cacac7', trim: '#b8b9be', floor: '#9a9ca3', floorLine: '#83858d', floor2: '#8d8f97',
  frame: '#4a4d55', glass: '#eff0ee', sky: '#e4e6e3', bld: '#b7b9bf', bld2: '#a2a5ac', dot: '#70737b',
  desk: '#44474e', deskTop: '#5b5e66', mon: '#1d1f24', screen: '#f3f4f1', plant: '#6e9a7c', plant2: '#4e7a5e', pot: '#d0d1cd',
  ink: '#141518', white: '#fafaf7', accent: '#2f7fc1', maroon: '#6b2a39', box: '#b29a74', box2: '#9a835f', tape: '#d9c9a5',
  chair: '#8c7a86', chair2: '#76656f', lamp: '#e8e2c8',
};
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function disc(cx, cy, r, c) { for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); R(cx - w, cy + dy, w * 2 + 1, 1, c); } }
function line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) R(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, 1, 1, c); }

function room(floorY) {
  R(0, 0, 240, floorY, C.wall); R(0, floorY - 10, 240, 10, C.wall2); R(0, floorY - 1, 240, 1, C.trim);
  R(0, floorY, 240, 135 - floorY, C.floor);
  for (let y = floorY + 6, g = 6; y < 135; g += 2, y += g) R(0, y, 240, 1, C.floorLine);
}
function clock(x, y, t) {
  disc(x, y, 9, C.ink); disc(x, y, 8, C.white);
  for (const [dx, dy] of [[0, -6], [6, 0], [0, 6], [-6, 0]]) R(x + dx, y + dy, 1, 1, C.frame);
  const a = t * 0.6, b = t * 0.05;
  line(x, y, x + Math.round(Math.sin(a) * 6), y - Math.round(Math.cos(a) * 6), C.ink);
  line(x, y, x + Math.round(Math.sin(b) * 4), y - Math.round(Math.cos(b) * 4), C.maroon);
}
function plant(x, y) {
  R(x - 5, y - 12, 11, 12, C.pot); R(x - 6, y - 13, 13, 2, '#bfc0bc');
  R(x - 6, y - 30, 13, 17, C.plant); R(x - 4, y - 36, 9, 7, C.plant); R(x - 2, y - 40, 5, 5, C.plant); R(x - 1, y - 28, 6, 14, C.plant2); R(x - 5, y - 22, 4, 8, C.plant2);
}
function cityWindow(x, y, w, h, t) {
  R(x - 2, y - 2, w + 4, h + 4, C.frame); R(x, y, w, h, C.glass);
  const bs = [[4, 20], [14, 30], [26, 24], [36, 34], [48, 18], [56, 28]];
  for (const [bx, bh] of bs) if (bx + 10 <= w) { R(x + bx, y + h - bh, 10, bh, bx % 3 ? C.bld : C.bld2); for (let yy = y + h - bh + 3; yy < y + h - 2; yy += 5) for (let xx = x + bx + 2; xx < x + bx + 9; xx += 4) R(xx, yy, 1, 1, C.dot); }
  R(x + w / 2 - 1, y, 2, h, C.frame); R(x, y + h / 2 - 1, w, 2, C.frame);
  R(x - 4, y + h + 2, w + 8, 2, C.trim);
  R(x + 6 + (t * 2 % 30), y + 6, 8, 2, '#ffffff'); // drifting cloud
}

function bgLiving(t) {
  room(68);
  // window with trees
  const x = 14, y = 12, w = 54, h = 40;
  R(x - 2, y - 2, w + 4, h + 4, C.frame); R(x, y, w, h, C.sky);
  R(x, y + h - 8, w, 8, '#b9c4b6'); for (const [tx, th] of [[6, 18], [22, 24], [40, 16]]) { R(x + tx, y + h - th, 9, th - 6, C.plant); R(x + tx + 3, y + h - 8, 2, 4, C.frame); }
  R(x + w / 2 - 1, y, 2, h, C.frame); R(x, y + h / 2 - 1, w, 2, C.frame); R(x - 4, y + h + 2, w + 8, 2, C.trim);
  clock(98, 20, t);
  // picture frames
  R(126, 14, 22, 18, C.frame); R(128, 16, 18, 14, '#c9d6dd'); R(130, 24, 14, 6, '#a7b3a2'); disc(140, 20, 2, '#f1e3b0');
  R(152, 18, 12, 14, C.frame); R(154, 20, 8, 10, '#e2d7cf'); R(157, 22, 2, 3, '#a68f84');
  // floor lamp
  R(226, 30, 1, 66, C.frame); R(220, 22, 13, 9, C.lamp); R(222, 95, 9, 2, C.frame);
  // armchair
  R(178, 62, 36, 22, C.chair); R(178, 62, 36, 3, C.chair2); R(176, 72, 7, 20, C.chair2); R(209, 72, 7, 20, C.chair2); R(182, 80, 28, 10, C.chair); R(180, 92, 3, 4, C.ink); R(209, 92, 3, 4, C.ink);
  // side table + tea
  R(150, 78, 18, 3, C.desk); R(152, 81, 2, 15, C.desk); R(164, 81, 2, 15, C.desk); R(156, 73, 5, 5, C.white); R(161, 74, 2, 2, C.white);
  plant(8, 96);
}
function bgCaller(t) {
  R(0, 0, 240, 68, '#62656d'); R(0, 58, 240, 10, '#575a62'); R(0, 67, 240, 1, '#4c4f57');
  R(0, 68, 240, 67, '#4b4d54'); for (let y = 74, g = 6; y < 135; g += 2, y += g) R(0, y, 240, 1, '#41434a');
  // blinds
  R(18, 10, 58, 42, '#2a2c31'); for (let i = 0; i < 10; i++) R(20, 12 + i * 4, 54, 2, '#8a8d95');
  R(14, 54, 66, 2, '#41434a');
  // bare bulb, swaying a little
  const sw = Math.round(Math.sin(t * 1.3) * 2);
  line(120, 0, 120 + sw, 12, '#2a2c31'); disc(120 + sw, 15, 3, '#f1e3b0'); R(119 + sw, 11, 3, 2, '#2a2c31');
  // sticky notes and a wall calendar
  R(92, 22, 8, 8, '#d9c96a'); R(102, 26, 8, 8, '#d9b46a'); R(96, 34, 8, 8, '#d9c96a');
  R(200, 16, 22, 26, '#d6d6d3'); R(200, 16, 22, 5, '#8a3a3a'); for (let i = 0; i < 12; i++) R(203 + (i % 4) * 5, 24 + Math.floor(i / 4) * 5, 3, 3, '#9a9ca3');
  // desk, laptop, spare phones
  R(56, 72, 104, 4, '#3a3d44'); R(60, 76, 96, 22, '#33353b'); R(60, 98, 96, 2, '#1d1f24');
  R(84, 58, 30, 14, '#1d1f24'); R(86, 60, 26, 10, Math.floor(t * 2) % 2 ? '#5b88a8' : '#5683a3'); R(78, 72, 42, 2, '#1d1f24');
  R(128, 69, 5, 3, '#1d1f24'); R(136, 69, 5, 3, '#1d1f24'); R(144, 69, 5, 3, '#1d1f24');
  R(66, 66, 8, 6, '#c9c4b5'); R(67, 64, 6, 2, '#c9c4b5'); // coffee cup
}
const BG = { living: bgLiving, caller: bgCaller };

// ---------------- Characters ----------------
const PAL = {
  linda:  { skin: '#f0c8ae', skinD: '#d6a88b', hair: '#cdd0d5', hairD: '#a9adb4', shirt: '#9a6f86', shirtD: '#7f5b6f', pants: '#4a4c55', pantsD: '#3a3c43', shoe: '#1d1f24', style: 'bun', glasses: true, long: true },
  caller: { skin: '#d9a882', skinD: '#bf8e6a', hair: '#3a3430', hairD: '#2a2522', shirt: '#6a6d75', shirtD: '#56595f', pants: '#2c2f36', pantsD: '#22252b', shoe: '#111215', style: 'cap', headset: true },
};
const A = {
  linda:  { x: 92, y: 97, face: 1, pose: 'stand', walk: false, talk: false, home: 'living' },
  caller: { x: 178, y: 97, face: -1, pose: 'stand', walk: false, talk: false, home: 'caller' },
};
function person(id, t) {
  const o = A[id], P = PAL[id], f = o.face, X = Math.round(o.x), Y = o.y;
  const r = (dx, dy, w, h, c) => R(f === 1 ? X + dx : X - dx - w + 1, Y + dy, w, h, c);
  const st = o.walk ? Math.floor(t * 7) % 2 : 0;
  const bob = (o.talk && Math.floor(t * 5) % 2) || (o.walk && st) ? -1 : 0;
  // legs and shoes
  const lb = o.walk ? (st ? -2 : 1) : 0, lf = o.walk ? (st ? 1 : -2) : 0;
  r(-3 + lb, -14, 3, 12, P.pantsD); r(-4 + lb, -2, 4, 2, P.shoe);
  r(0 + lf, -14, 3, 12, P.pants); r(0 + lf, -2, 5, 2, P.shoe);
  // torso
  const th = P.long ? 19 : 16;
  r(-5, -30 + bob, 11, th, P.shirt); r(-5, -30 + bob, 2, th, P.shirtD); r(-1, -30 + bob, 3, 1, P.skinD);
  // neck + head
  r(-1, -32 + bob, 4, 2, P.skinD);
  r(-5, -42 + bob, 10, 10, P.skin); r(5, -37 + bob, 1, 2, P.skin); // nose
  r(-1, -37 + bob, 2, 3, P.skinD); // ear
  const blink = (t % 4.4) < 0.13;
  r(2, -39 + bob + (blink ? 1 : 0), 1, blink ? 1 : 2, '#1b1d22');
  const open = o.talk && (Math.floor(t * 10) % 3 !== 0);
  r(2, -35 + bob, 3, open ? 2 : 1, open ? '#5a2630' : '#8a4b4b');
  // hair
  if (P.style === 'bun') { r(-5, -43 + bob, 10, 3, P.hair); r(-6, -42 + bob, 4, 8, P.hair); r(-9, -44 + bob, 4, 4, P.hairD); r(-2, -43 + bob, 4, 1, '#e6e8eb'); }
  if (P.style === 'bob') { r(-5, -43 + bob, 11, 3, P.hair); r(-7, -42 + bob, 5, 12, P.hair); r(3, -41 + bob, 3, 2, P.hair); r(-7, -31 + bob, 4, 1, P.hairD); }
  if (P.style === 'cap') { r(-6, -45 + bob, 12, 4, '#2b2e34'); r(5, -42 + bob, 4, 1, '#2b2e34'); r(-6, -41 + bob, 3, 5, P.hair); }
  if (P.style === 'short') { r(-5, -43 + bob, 10, 2, P.hair); r(-6, -42 + bob, 3, 6, P.hair); r(-2, -41 + bob, 2, 1, P.hair); }
  if (P.beard) { r(-2, -33 + bob, 8, 2, P.hair); r(-2, -36 + bob, 1, 3, P.hair); r(2, -35 + bob, 3, open ? 2 : 1, open ? '#3d1c22' : '#9c5b52'); }
  if (P.glasses) { r(1, -40 + bob, 4, 1, '#2a2c31'); r(4, -39 + bob, 1, 2, '#2a2c31'); r(1, -39 + bob, 1, 2, '#2a2c31'); }
  if (P.headset) { r(-2, -38 + bob, 2, 4, '#1b1d22'); r(-1, -44 + bob, 2, 1, '#1b1d22'); r(0, -34 + bob, 4, 1, '#1b1d22'); r(4, -35 + bob, 1, 2, '#1b1d22'); }
  // arm by pose
  const sw = o.walk ? (st ? 1 : -1) : 0;
  if (o.pose === 'phone') { r(0, -29 + bob, 3, 7, P.shirt); r(0, -23 + bob, 7, 3, P.shirt); r(6, -25 + bob, 3, 3, P.skin); r(8, -30 + bob, 3, 6, '#1b1d22'); r(9, -29 + bob, 1, 4, '#7fc4f5'); }
  else if (o.pose === 'ear') { r(0, -29 + bob, 3, 5, P.shirt); r(1, -35 + bob, 3, 7, P.shirt); r(0, -39 + bob, 3, 3, P.skin); r(-1, -42 + bob, 2, 6, '#1b1d22'); }
  else if (o.pose === 'type') { r(0, -29 + bob, 3, 8, P.shirt); r(0, -22 + bob, 6, 3, P.shirt); r(5, -22 + bob + (Math.floor(t * 8) % 2), 3, 2, P.skin); }
  else { r(0 + sw, -29 + bob, 3, 12, P.shirt); r(0 + sw, -17 + bob, 3, 3, P.skin); }
  // ringing phone
  if (o.ring && Math.floor(t * 4) % 2) { const rx = f === 1 ? X + 9 : X - 12; for (let i = 0; i < 3; i++) { R(rx + i * 3, Y - 50 - i, 1, 3 + i * 2, C.accent); } }
}

// Flying envelope and phone buzz marks
const fx = { env: null, buzz: false };
function drawFx(t) {
  if (fx.env) {
    const p = Math.min(1, (t - fx.env.t0) / 1.4); if (p >= 1) fx.env = null; else {
      const x = fx.env.x + (fx.env.tx - fx.env.x) * p, y = fx.env.y + (fx.env.ty - fx.env.y) * p - Math.sin(p * Math.PI) * 18;
      R(x, y, 9, 7, C.ink); R(x + 1, y + 1, 7, 5, C.white); R(x + 2, y + 2, 1, 1, C.ink); R(x + 3, y + 3, 1, 1, C.ink); R(x + 4, y + 4, 1, 1, C.ink); R(x + 5, y + 3, 1, 1, C.ink); R(x + 6, y + 2, 1, 1, C.ink);
    }
  }
  const L = A.linda;
  if (fx.buzz && scene === 'living' && Math.floor(t * 6) % 2) { R(L.x + 13, L.y - 31, 1, 2, C.ink); R(L.x + 15, L.y - 32, 1, 4, C.ink); }
}

let scene = 'living';
function draw(t) {
  BG[scene](t);
  for (const id of Object.keys(A)) if (A[id].home === scene) person(id, t);
  drawFx(t);
}

const PANELS = {

function panel(name) { const p = $('panel'); if (!name) { p.className = 'panel'; p.innerHTML = ''; return; } p.innerHTML = PANELS[name](); p.className = 'panel'; void p.offsetWidth; p.className = 'panel on'; }
let hudRows = null;
function hud(rows) { hudRows = rows; renderHud(); }
function renderHud() {
  const h = $('hud'); if (!hudRows) { h.className = 'hud'; return; }
  h.innerHTML = hudRows.map(([k, v, ok]) => `<div class="r"><span class="k">${k}</span><span class="v${ok ? ' ok' : ''}">${typeof v === 'function' ? v() : v}</span></div>`).join('');
  h.className = 'hud on';
}
const on = (sel) => document.querySelectorAll(sel).forEach(e => e.classList.add('on'));
const show = id => { const e = $(id); if (e) e.style.display = 'block'; };
const press = id => { const e = $(id); if (!e) return; e.classList.add('press'); setTimeout(() => e.classList.remove('press'), 250); };

let ac = null, musicBus, voiceBus, sfxBus, buffers = {}, musicOn = false, mStep = 0, mNext = 0;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  const master = ac.createGain(); master.connect(ac.destination);
  const soft = ac.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 2200; soft.connect(master);
  musicBus = ac.createGain(); musicBus.gain.value = .5; musicBus.connect(soft);
  voiceBus = ac.createGain(); voiceBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = .6; sfxBus.connect(master);
  const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(master); s.start(); // unlock on iOS
}
async function loadClips() {
  await Promise.all(Object.entries(CLIPS).map(async ([k, uri]) => {
    try {
      const bin = atob(uri.split(',')[1]), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      buffers[k] = await new Promise((res, rej) => ac.decodeAudioData(u8.buffer, res, rej));
    } catch (e) { /* that line falls back to captions only */ }
  }));
}
function tone(bus, f, t0, dur, type, g, f2) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(g, t0 + .012); e.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(e); e.connect(bus); o.start(t0); o.stop(t0 + dur + .03);
}
const SFX = {
  buzz:  t => { for (let i = 0; i < 3; i++) tone(sfxBus, 140, t + i * .22, .15, 'sawtooth', .09); },
  pop:   t => { tone(sfxBus, 740, t, .09, 'square', .07); tone(sfxBus, 990, t + .05, .1, 'square', .05); },
  click: t => tone(sfxBus, 1100, t, .05, 'square', .08),

};

// Music: a quiet chiptune loop (C, Am, F, G), ducked under the voices.
const PROG = [[48, 55, 64, 67], [45, 52, 60, 64], [41, 48, 57, 60], [43, 50, 59, 62]];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick() {
  if (!ac || !musicOn || ac.state !== 'running') return;
  const e8 = 60 / 92 / 2;
  if (mNext < ac.currentTime) mNext = ac.currentTime + .05;
  while (mNext < ac.currentTime + .3) {
    const ch = PROG[Math.floor(mStep / 16) % 4], s = mStep % 8;
    if (mStep % 8 === 0) tone(musicBus, mtof(ch[0] - 12), mNext, e8 * 7.5, 'triangle', .16);
    tone(musicBus, mtof(ch[[1, 2, 3, 2, 1, 2, 3, 2][s]] + 12), mNext, e8 * .85, 'square', .022);
    if (mStep % 4 === 2) tone(musicBus, 90, mNext, .06, 'square', .02);
    mStep++; mNext += e8;
  }
}
setInterval(musicTick, 60);
function duck(on) { if (ac) musicBus.gain.setTargetAtTime(on ? .18 : .5, ac.currentTime, .12); }

let vt = 0, playing = false, runId = 0, waiters = [], playWaiters = [], cancelSpeech = null;

const waitPlay = id => new Promise(res => playing || id !== runId ? res() : playWaiters.push(res));
function flushPlay() { const w = playWaiters; playWaiters = []; w.forEach(f => f()); }

const NAMES = { linda: 'LINDA', text: 'TEXT FROM UNKNOWN NUMBER', vt: 'VANTIS', caller: 'CALLER' };
let cap = null;
const est = text => 0.4 + text.length * 0.052;
function caption(who, text, fine) { cap = { text, t0: vt, est: buffers[text] ? buffers[text].duration : est(text), full: false }; $('who').textContent = NAMES[who]; $('fine').textContent = fine || ''; $('say').textContent = ''; $('dlg').classList.remove('hide'); }

function speakOnce(who, text, id) {
  const actor = A[who];
  if (actor) actor.talk = true;
  const done = r => { if (actor) actor.talk = false; return r; };
  const b = buffers[text];
  if (!b || !ac) return sleep(est(text), id).then(() => done('done'));
  return new Promise(res => {
    const src = ac.createBufferSource(); src.buffer = b; src.connect(voiceBus);
    let fin = false; const finish = r => { if (fin) return; fin = true; cancelSpeech = null; duck(false); res(done(r)); };
    src.onended = () => finish('done');
    cancelSpeech = () => { src.onended = null; try { src.stop(); } catch (e) {} finish('cancel'); };
    duck(true); src.start();
  });
}
async function say(id, who, text, fine) {
  caption(who, text, fine);
  if (!playing) await waitPlay(id);
  if (id !== runId) return;
  await speakOnce(who, text, id);
  if (id !== runId) return;
  if (cap) cap.full = true;
  await sleep(0.2, id);
}

  { do: () => { go('living'); L.pose = 'phone'; panel('screened'); sfx('hold'); hud([['CALL', 'NOT PUT THROUGH', 1], ['MONEY SENT', '$0']]); }, say: ['vt', 'A caller claimed to be your bank and wanted your money moved. I didn’t put them through.'] },
  { say: ['linda', 'Thank you, Vantis.'] },
  { do: () => { panel(null); hud(null); $('end').classList.add('on'); sfx('end'); }, say: ['vt', 'Vantis. Check first, then decide.'], wait: 1.6 },
];

function resetWorld() {
  $('end').classList.remove('on'); panel(null); hud(null); $('dlg').classList.add('hide'); cap = null;
  Object.assign(L, { x: 92, face: 1, pose: 'stand', walk: false, talk: false, tw: null, ring: false });
  Object.assign(K, { x: 178, face: -1, pose: 'stand', walk: false, talk: false, tw: null });
  fx.env = null; fx.buzz = false; scene = 'living';
}
async function run(id) {
  resetWorld();
  for (const b of S) {
    if (id !== runId) return;
    if (b.do) b.do();
    if (b.say) await say(id, ...b.say);
    if (id !== runId) return;
    if (b.wait) await sleep(b.wait, id);
  }
  if (id === runId) { runId++; run(runId); }
}

// ---------------- Frame loop ----------------
let last = null;
function frame(now) {
  if (playing && last !== null) vt += Math.min(0.1, (now - last) / 1000);
  last = now;
  const ready = waiters.filter(w => w.end <= vt || w.id !== runId); waiters = waiters.filter(w => !ready.includes(w)); ready.forEach(w => w.res());
  for (const o of Object.values(A)) if (o.tw) { const p = Math.min(1, (vt - o.tw.t0) / o.tw.dur); o.x = o.tw.from + (o.tw.to - o.tw.from) * p; if (p >= 1) { o.tw = null; o.walk = false; } }
  if (cap) { const n = cap.full ? cap.text.length : Math.min(cap.text.length, Math.ceil(cap.text.length * (vt - cap.t0) / cap.est)); const s = cap.text.slice(0, n); if ($('say').textContent !== s) $('say').textContent = s; }
  if (hudRows && hudRows.some(r => typeof r[1] === 'function')) renderHud();
  draw(vt);
  requestAnimationFrame(frame);
}

// ---------------- Controls (hidden: tap or Space to pause, R to restart) ----------------
function setPlaying(p) { playing = p; if (ac) (p ? ac.resume() : ac.suspend()); if (p) flushPlay(); }
function restart() { runId++; stopSpeech(); waiters.forEach(w => w.res()); waiters = []; flushPlay(); setPlaying(true); run(runId); }
async function begin() {
  $('go').textContent = 'Loading…'; $('go').disabled = true;
  initAudio();
  if (ac) { await ac.resume(); await loadClips(); musicOn = true; mNext = ac.currentTime + .1; }
  $('start').remove();
  restart();
}
$('go').onclick = begin;
stage.addEventListener('click', () => { if (!$('start')) setPlaying(!playing); });
addEventListener('keydown', e => {
  if ($('start')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'r' || e.key === 'R') restart();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && playing && !$('start')) setPlaying(false); });

resetWorld();
requestAnimationFrame(frame);
})();
</script>
